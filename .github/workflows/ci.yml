name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned compatibility dependency
        run: python -m pip install openevolve==0.3.2
      - name: Run unit and entrypoint tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B -m unittest discover -s skill/openevolve-scientist/scripts/tests -v
      - name: Validate repository and Skill structure
        run: python tools/build_release.py --check-only

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned OpenEvolve image
        run: docker build --tag openevolve-scientist-smoke skill/openevolve-scientist/assets/experiment-template
      - name: Execute image entrypoint
        run: docker run --rm openevolve-scientist-smoke --help

  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned compatibility dependency
        run: python -m pip install openevolve==0.3.2
      - name: Build release archives
        run: python tools/build_release.py --output-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: openevolve-scientist-release
          path: dist/*.zip
